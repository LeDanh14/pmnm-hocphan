{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm border-primary">
    <div class="card-header bg-primary text-white"><h4 class="mb-0">Đăng nhập</h4></div>
    <div class="card-body">
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" value="{{ old_username }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="remember" class="form-check-input" id="rememberCheck">
                <label class="form-check-label" for="rememberCheck">Ghi nhớ đăng nhập</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>
    </div>
</div>
{% endblock %}
