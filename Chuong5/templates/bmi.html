{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm border-info">
    <div class="card-header bg-info text-dark"><h5 class="mb-0">Tính chỉ số BMI</h5></div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Chiều cao (cm):</label>
                <input type="text" name="cao" value="{{ cao if cao is not none else '' }}" class="form-control" placeholder="VD: 170">
                {% if err_cao %}<div class="text-danger small mt-1">{{ err_cao }}</div>{% endif %}
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Cân nặng (kg):</label>
                <input type="text" name="nang" value="{{ nang if nang is not none else '' }}" class="form-control" placeholder="VD: 65,5">
                {% if err_nang %}<div class="text-danger small mt-1">{{ err_nang }}</div>{% endif %}
            </div>
            <button type="submit" class="btn btn-info w-100 mb-3">Tính BMI</button>
            {% if bmi_result is not none %}
            <div class="alert alert-secondary mb-0">
                <strong>Kết quả:</strong> <span class="fw-bold {{ bmi_color }}">{{ bmi_result }} - {{ bmi_status }}</span> <br>
                <small class="text-muted">Cân nặng mục tiêu: {{ target_weight }}</small>
            </div>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
